name: mostransport

services:
  # ML serving (owned by ML team). Runs with the integration-only artifact
  # by default — see docs/DOCKER_COMPOSE.md for how to point it at a real
  # Artifact Bundle instead. INTEGRATION TEST ONLY predictions until then.
  ml:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MOSTRANSPORT_ARTIFACT_DIR: /artifact
    volumes:
      - ${ML_ARTIFACT_DIR:-./ml-artifact}:/artifact:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  postgres:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mostransport
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mostransport"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/mtr_DB_v2.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/schedule_actions_import_fixed.csv:/docker-entrypoint-initdb.d/data/schedule_actions_import_fixed.csv:ro
      - ./docker/initdb/02-import-schedule.sh:/docker-entrypoint-initdb.d/02-import-schedule.sh:ro
  backend:
    build:
      context: ./backend
    depends_on:
      ml:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000" # REST/WebSocket API for frontend
      - "9000:9000" # NDTP telemetry ingest (TCP)
    environment:
      PORT: 3000
      TELEMETRY_PORT: 9000
      ML_SERVICE_URL: http://ml:8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mostransport?schema=public

  frontend:
    build:
      context: ./frontend
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
    depends_on:
      - backend
    ports:
      - "8080:80"

  # NDTP telemetry emulator (organizer-provided image, loaded separately —
  # see docs/DOCKER_COMPOSE.md). Control/config REST API on :18080.
  emulator:
    image: ndtp-telemetry-emulator:1.0
    depends_on:
      - backend
    ports:
      - "18080:18080"

  # One-shot: waits for the emulator's control API and points it at the
  # backend's NDTP receiver. This is the whole "scheduler" for the emulator
  # itself — intentionally not a separate always-on service.
  emulator-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - emulator
      - backend
    volumes:
      - ./docker/emulator-config.json:/emulator-config.json:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        until curl -sf http://emulator:18080/api/cells > /dev/null; do sleep 1; done;
        curl -sf -X POST http://emulator:18080/api/config
        -H 'Content-Type: application/json'
        --data @/emulator-config.json
    restart: "no"
volumes:
  postgres_data:
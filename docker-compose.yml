name: mostransport

services:
  # ML serving (owned by ML team). Mounts the final HGB bundle
  # hgb-h0-runtime-safe-v1-group-a-v1 by default (git-ignored; produced by
  # scripts/train_final_hgb.py, see docs/DOCKER_COMPOSE.md). Healthy == /ready.
  ml:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MOSTRANSPORT_ARTIFACT_DIR: /artifact
    volumes:
      # The committed ./ml-artifact is an integration fixture WITHOUT its model file and is never ready.
      - ${ML_ARTIFACT_DIR:-./artifacts/hgb-h0-runtime-safe-v1-group-a-v1}:/artifact:ro
    healthcheck:
      # Healthy == model artifact loaded and compatible (/ready), not merely "process alive" (/health).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  postgres:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mostransport
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mostransport"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/mtr_DB_v2.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/schedule_actions_import_fixed.csv:/docker-entrypoint-initdb.d/data/schedule_actions_import_fixed.csv:ro
      - ./docker/initdb/02-import-schedule.sh:/docker-entrypoint-initdb.d/02-import-schedule.sh:ro
  backend:
    build:
      context: ./backend
    depends_on:
      ml:
        # Ingestion and UI start even when ML is honestly not ready; predictions then return 503.
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000" # REST/WebSocket API for frontend
      - "9000:9000" # NDTP telemetry ingest (TCP)
    environment:
      PORT: 3000
      TELEMETRY_PORT: 9000
      ML_SERVICE_URL: http://ml:8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mostransport?schema=public
      # Demo clock (backend/src/common/demo-clock.ts). This stack's emulator stamps packets
      # with the live wall clock, so the demo shifts the whole session by whole days onto the
      # schedule day (constant offset, intervals preserved). Use off for organizer data that
      # is already on the schedule day.
      DEMO_CLOCK_MODE: ${DEMO_CLOCK_MODE:-day_shift}
      DEMO_CLOCK_TARGET_DAY: ${DEMO_CLOCK_TARGET_DAY:-2026-01-06}
      DEMO_CLOCK_ANCHOR: ${DEMO_CLOCK_ANCHOR:-}
      # none = no factual passage feed exists (current deviation flagged unavailable);
      # replay_import = TRAIN-day facts imported with scripts/import_db_seed.py --replay-facts.
      SCHEDULE_FACT_SOURCE: ${SCHEDULE_FACT_SOURCE:-none}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY}
    depends_on:
      - backend
    ports:
      - "8080:80"

  # NDTP telemetry emulator (organizer-provided image, loaded separately —
  # see docs/DOCKER_COMPOSE.md). Control/config REST API on :18080.
  emulator:
    image: ndtp-telemetry-emulator:1.0
    depends_on:
      - backend
    ports:
      - "18080:18080"

  # One-shot: waits for the emulator's control API and points it at the
  # backend's NDTP receiver. This is the whole "scheduler" for the emulator
  # itself — intentionally not a separate always-on service.
  emulator-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - emulator
      - backend
    volumes:
      - ./docker/emulator-config.json:/emulator-config.json:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        until curl -sf http://emulator:18080/api/cells > /dev/null; do sleep 1; done;
        curl -sf -X POST http://emulator:18080/api/config
        -H 'Content-Type: application/json'
        --data @/emulator-config.json
    restart: "no"
volumes:
  postgres_data:
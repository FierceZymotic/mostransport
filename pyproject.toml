[project]
name = "mostransport-ml"
version = "0.1.0"
description = "Mostransport hackathon ML: point-in-time tabular features, Artifact Bundle v1 models and the Backend -> ML Contract v1 inference service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "catboost>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]
serving = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    # starlette.testclient (используется fastapi.testclient в наших serving-тестах)
    # предпочитает httpx2 вместо httpx и выдаёт warning, если установлен только httpx.
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mostransport_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
